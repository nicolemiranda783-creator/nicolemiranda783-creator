<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img" aria-label="Gracias por pasar">
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#FFE6EF"/><stop offset="1" stop-color="#F1DDF6"/></linearGradient>
    <path id="s" d="M0,-10 C1.5,-2.5 2.5,-1.5 10,0 C2.5,1.5 1.5,2.5 0,10 C-1.5,2.5 -2.5,1.5 -10,0 C-2.5,-1.5 -1.5,-2.5 0,-10Z"/>
    <style>
      .tw{transform-box:fill-box;transform-origin:center;animation:tw 2.6s ease-in-out infinite}.b{animation-delay:.7s}.c{animation-delay:1.4s}.d{animation-delay:2s}
      @keyframes tw{0%,100%{opacity:.3;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1) rotate(20deg)}}
      .t{font:600 26px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#6B3A52}
      .s{font:400 18px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#8B5A72}
    </style>
  </defs>
  <rect x="4" y="4" width="1192" height="122" rx="26" fill="url(#bg)" stroke="#F4B8CE" stroke-width="2"/>
  <text x="600" y="60" text-anchor="middle" class="t">gracias por pasar ✦</text>
  <text x="600" y="92" text-anchor="middle" class="s">diseñando experiencias bonitas, claras y fáciles de usar</text>
  <g transform="translate(330 52)" fill="#E98BAE"><use href="#s" class="tw"/></g>
  <g transform="translate(870 52)" fill="#E98BAE"><use href="#s" class="tw b"/></g>
  <g transform="translate(90 64) scale(1.3)" fill="#FFFFFF"><use href="#s" class="tw c"/></g>
  <g transform="translate(1110 64) scale(1.3)" fill="#FFFFFF"><use href="#s" class="tw d"/></g>
  <g transform="translate(200 98) scale(.7)" fill="#F7CF7E"><use href="#s" class="tw b"/></g>
  <g transform="translate(1000 30) scale(.7)" fill="#F7CF7E"><use href="#s" class="tw"/></g>
</svg>
